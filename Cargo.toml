[workspace]
resolver = "3"
members = [
    "crates/berth-core",
    "crates/berth-term",
    "crates/berth-probe",
    "crates/berth-timeline",
    "crates/berth-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
berth-core = { path = "crates/berth-core" }
berth-probe = { path = "crates/berth-probe" }
berth-term = { path = "crates/berth-term" }
berth-timeline = { path = "crates/berth-timeline" }

# gpui is pinned to a Zed commit; it is only published to crates.io sporadically
# (0.2.2 dates from 2025-10) and the Windows backend moves fast on main.
# Pinned rev: zed-industries/zed @ 33375c34 (2026-09-03), toolchain 1.97.1.
gpui = { git = "https://github.com/zed-industries/zed", rev = "33375c34b9301dd850b0e6d9781fd00acace6953" }
# `application()` lives here rather than in gpui itself on this revision.
#
# `font-kit` is not optional in practice. It maps to `gpui_macos/font-kit`, and
# gpui_platform's default feature set is empty, so without it the macOS text
# system comes up unable to see a single installed font: `all_font_names()`
# returns gpui's own 11-entry fallback list, `add_fonts` reports success and
# registers nothing, and every glyph rasterises empty while metrics and layout
# still look correct. The window renders, and nothing in it has any text. See
# decisions.md D2 and B5.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "33375c34b9301dd850b0e6d9781fd00acace6953", features = [
    "font-kit",
] }

# russh >= 0.5x re-exports key handling as `russh::keys`; the standalone
# russh-keys crate is stale at 0.49 and is not used. The default aws-lc-rs
# backend needs NASM to build on Windows, so ring is used instead.
russh = { version = "0.63", default-features = false, features = ["flate2", "ring", "rsa"] }
# The terminal engine (D49): libghostty-vt through its Rust bindings, pinned to
# the commit whose snapshot API Berth uses. Built from Ghostty's source with
# Zig 0.16.0; see .cargo/config.toml and scripts/fetch-ghostty.sh.
libghostty-vt = { git = "https://github.com/quirelabs/libghostty-rs-mirror", rev = "8953a740bc378cec3e07e1f6ca949f0595eab19b" }
# Local PTYs on three platforms. Unix is openpty plus fork and exec, but Windows
# ConPTY is fiddly enough that owning it would be days of work and then ours
# forever. This is wezterm's, actively maintained, and the seam it sits behind
# is one constructor, so replacing it later touches one file.
portable-pty = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
zstd = "0.13"

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "8"
dirs = "6"
shellexpand = "3"
regex = "1"
sha2 = "0.10"
hex = "0.4"

proptest = "1"
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Without debug info the bindings build libghostty-vt with Zig's ReleaseFast
# rather than Debug, which parses slowly enough to stall a test on a megabyte.
[profile.dev.package.libghostty-vt-sys]
debug = false
