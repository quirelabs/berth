[package]
name = "berth-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
russh.workspace = true
portable-pty.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
notify.workspace = true
dirs.workspace = true
shellexpand.workspace = true
# The worker's terminal and its wire format (D50). Neither depends on
# berth-core, so this creates no cycle.
berth-term.workspace = true
berth-proto.workspace = true
sha2.workspace = true
hex.workspace = true

[features]
# Lets BERTH_SERVER_DIR choose the server binaries installed on hosts.
# Development only: never enabled in a release build (D55, release blockers).
dev-server-dir = []

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
berth-probe.workspace = true
proptest.workspace = true
tempfile.workspace = true
