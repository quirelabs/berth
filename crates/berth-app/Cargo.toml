[package]
name = "berth-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "berth"
path = "src/main.rs"

[dependencies]
berth-core.workspace = true
berth-probe.workspace = true
berth-term.workspace = true
berth-timeline.workspace = true

gpui.workspace = true
gpui_platform.workspace = true
anyhow.workspace = true
tokio.workspace = true
futures = "0.3"
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Decoding the screenshot the pixel check takes. Already in the tree via gpui,
# so this adds a direct reference rather than new code.
image = { version = "0.25", default-features = false, features = ["png"] }
