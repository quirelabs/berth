name: spike-libghostty

# D49 step 1: build and run the libghostty-vt spike where it cannot be built
# locally, Windows above all. Only on the spike branch, or by hand.
on:
  push:
    branches: [spike/libghostty]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            zig: zig-x86_64-windows-0.16.0
            archive: zip
            sha256: 68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e
          - os: macos-latest
            zig: zig-aarch64-macos-0.16.0
            archive: tar.xz
            sha256: b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
          - os: ubuntu-latest
            zig: zig-x86_64-linux-0.16.0
            archive: tar.xz
            sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: spikes/libghostty
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      # Straight from ziglang.org, checked against its published SHA-256, so
      # no third-party action is needed for it.
      - name: Zig 0.16.0
        run: |
          set -x
          # Git Bash on Windows gets Windows paths from the runner; convert
          # them for the shell and back for GITHUB_PATH.
          tmp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null; then tmp=$(cygpath -u "$RUNNER_TEMP"); fi
          file="${{ matrix.zig }}.${{ matrix.archive }}"
          curl -sSfL -o "$tmp/$file" "https://ziglang.org/download/0.16.0/$file"
          if command -v sha256sum >/dev/null; then sum=$(sha256sum "$tmp/$file" | cut -d' ' -f1); else sum=$(shasum -a 256 "$tmp/$file" | cut -d' ' -f1); fi
          echo "sha256: $sum"
          test "$sum" = "${{ matrix.sha256 }}"
          cd "$tmp"
          if [ "${{ matrix.archive }}" = zip ]; then unzip -q "$file"; else tar -xJf "$file"; fi
          dir="$tmp/${{ matrix.zig }}"
          if command -v cygpath >/dev/null; then dir=$(cygpath -w "$dir"); fi
          echo "$dir" >> "$GITHUB_PATH"
      - run: zig version

      - name: Build from the pinned, checksummed Ghostty source
        run: |
          export GHOSTTY_SOURCE_DIR=$(./fetch-ghostty.sh)
          cargo build --release

      - name: Run the spike report
        run: ./target/release/libghostty-spike

      # Linux parsed three times slower than the current engine on the first
      # run. The bindings build for a baseline x86 CPU by default, which leaves
      # out the vector paths; this measures the same report built for x86-64-v3.
      - name: Linux, built for x86-64-v3
        if: runner.os == 'Linux'
        run: |
          export GHOSTTY_SOURCE_DIR=$(./fetch-ghostty.sh)
          LIBGHOSTTY_VT_SYS_CPU=x86_64_v3 cargo build --release
          ./target/release/libghostty-spike | sed -n '/5. Throughput/,$p'

